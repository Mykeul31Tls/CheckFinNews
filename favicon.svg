<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a3a"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
    <radialGradient id="halo" cx="35%" cy="30%" r="60%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4d9fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4d9fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#halo)"/>

  <!-- Ascending chart line visible at larger sizes -->
  <polyline
    points="48,430 138,342 216,378 318,244 408,282 472,168"
    fill="none"
    stroke="#4d9fff"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.22"/>

  <!-- "C" arc: center (248,256), radius 168, 45-degree opening each side on the right -->
  <!-- Upper tip: (367, 137) / Lower tip: (367, 375) -->
  <path
    d="M 367 137 A 168 168 0 1 0 367 375"
    fill="none"
    stroke="white"
    stroke-width="62"
    stroke-linecap="round"/>

  <!-- Blue accent dots at the C tips -->
  <circle cx="367" cy="137" r="16" fill="#4d9fff"/>
  <circle cx="367" cy="375" r="16" fill="#4d9fff"/>
</svg>
